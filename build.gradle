plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.starfantasy.refinedstorageaddon'
version = '0.7.0'

base {
    archivesName = 'star_fantasy_refinedstorage_addon'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                star_fantasy_refinedstorage_addon {
                    source sourceSets.main
                }
            }
        }

        client {}
        server {
            args '--nogui'
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
    mavenCentral()
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    implementation fg.deobf('local:refinedstorage:1.12.4')
    compileOnly fg.deobf('local:goety:2.5.56.5')
    compileOnly fg.deobf('local:transmog-forge:1.3.0+1.20')
    compileOnly fg.deobf('local:quality_equipment:1.6-forge_neoforge-1.20.1')
    compileOnly fg.deobf('local:TerraCurio:0.2.0')
    compileOnly fg.deobf('local:Disenchanting-forge:1.20.1-2.2.4')
    compileOnly fg.deobf('local:irons_spellbooks:1.20.1-3.16.3')
    compileOnly fg.deobf('local:tacz:1.20.1-1.1.7-hotfix')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.2.0.22')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.2.0.22')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [mod_version: project.version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        rename { 'LICENSE_star_fantasy_refinedstorage_addon' }
    }
    manifest {
        attributes([
                'Specification-Title'     : 'star_fantasy_refinedstorage_addon',
                'Specification-Vendor'    : '',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : '',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
